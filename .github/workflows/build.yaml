name: Build
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: getting the code
        uses: actions/checkout@v4
      - name: installing node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: installing dependencies
        run: npm ci
      - name: linting the app
        run: npm run lint
      - name: building the site
        run: npm run build
        
  
