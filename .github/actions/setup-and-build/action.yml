name: Setup and Build
description: Checkout code, set up Node.js, install dependencies, lint, and build

inputs:
  fetch-depth:
    description: Number of commits to fetch (0 = full history)
    required: false
    default: '1'
  node-version:
    description: Node.js version to use
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash

    # - name: Lint
    #   run: npm run lint
    #   shell: bash

    - name: Build
      run: npm run build
      shell: bash