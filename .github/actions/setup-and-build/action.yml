name: Setup and Build
description: Set up Node.js, install dependencies, lint, and build

inputs:
  node-version:
    description: Node.js version to use
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install

    # - name: Lint
    #   run: npm run lint
    #   shell: bash

    - name: Build
      run: npm run build